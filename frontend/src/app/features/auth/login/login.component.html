<div class="min-h-screen flex items-center justify-center relative overflow-hidden py-12 px-4 sm:px-6"
  style="background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);">

  <!-- Animated background orbs -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-40 -left-40 w-96 h-96 rounded-full opacity-20 animate-pulse"
      style="background: radial-gradient(circle, #7c3aed, transparent 70%); animation-duration: 4s;"></div>
    <div class="absolute -bottom-32 -right-32 w-[500px] h-[500px] rounded-full opacity-15 animate-pulse"
      style="background: radial-gradient(circle, #06b6d4, transparent 70%); animation-duration: 6s;"></div>
    <div class="absolute top-1/3 right-1/4 w-64 h-64 rounded-full opacity-10 animate-pulse"
      style="background: radial-gradient(circle, #ec4899, transparent 70%); animation-duration: 5s;"></div>
    <!-- Floating particles -->
    <div class="absolute top-1/4 left-1/3 w-2 h-2 bg-purple-400/30 rounded-full"
      style="animation: float 8s ease-in-out infinite;"></div>
    <div class="absolute top-2/3 left-1/5 w-1.5 h-1.5 bg-cyan-400/25 rounded-full"
      style="animation: float 10s ease-in-out infinite 2s;"></div>
    <div class="absolute top-1/2 right-1/3 w-1 h-1 bg-pink-400/30 rounded-full"
      style="animation: float 7s ease-in-out infinite 1s;"></div>
  </div>

  <!-- Glass Card -->
  <div class="relative z-10 w-full max-w-md mx-4  animate-[fadeInUp_0.8s_ease-out]">

    <!-- Top glow accent -->
    <div class="absolute -top-px left-8 right-8 h-px"
      style="background: linear-gradient(90deg, transparent, rgba(124,58,237,0.5), rgba(6,182,212,0.5), transparent);">
    </div>


    <div class="rounded-3xl p-5 md:p-7  shadow-2xl border border-white/10 bg-white/[0.07] "
      style="backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);">

      <!-- Logo & Header -->
      <div class="text-center mt-7 mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl my-4 shadow-lg"
          style="background: linear-gradient(135deg, #7c3aed, #06b6d4);">
          <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
          </svg>
        </div>
        <h1 class="text-2xl font-bold text-white tracking-tight">Welcome Back</h1>
        <p class="text-sm text-white/50 mt-1.5">Sign in to your IELTS Prep account</p>
      </div>

      <!-- Success Message -->
      @if (successMessage()) {
      <div class="mb-6 p-3.5 rounded-xl text-sm font-medium text-emerald-300 border border-emerald-500/20"
        style="background: rgba(16,185,129,0.1); backdrop-filter: blur(8px);">
        <div class="flex items-center gap-2">
          <svg class="w-4 h-4 shrink-0" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd"
              d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
              clip-rule="evenodd" />
          </svg>
          {{ successMessage() }}
        </div>
      </div>
      }

      <!-- Error Message -->
      @if (errorMessage()) {
      <div class="mb-6 p-3.5 rounded-xl text-sm font-medium text-red-300 border border-red-500/20"
        style="background: rgba(239,68,68,0.1); backdrop-filter: blur(8px);">
        <div class="flex items-center gap-2">
          <svg class="w-4 h-4 shrink-0" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd"
              d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"
              clip-rule="evenodd" />
          </svg>
          {{ errorMessage() }}
        </div>
      </div>
      }

      <!-- Form -->
      <form (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
        <!-- Email Field -->
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Email Address</mat-label>
          <mat-icon matPrefix class="opacity-70 mr-2">email</mat-icon>
          <input matInput type="email" [ngModel]="email()" (ngModelChange)="email.set($event)" name="email"
            placeholder="you@example.com" autocomplete="email" required />
        </mat-form-field>

        <!-- Password Field -->
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Password</mat-label>
          <mat-icon matPrefix class="opacity-70 mr-2">lock</mat-icon>
          <input matInput [type]="showPassword() ? 'text' : 'password'" [ngModel]="password()"
            (ngModelChange)="password.set($event)" name="password" placeholder="••••••••"
            autocomplete="current-password" required />
          <button mat-icon-button matSuffix type="button" (click)="togglePasswordVisibility()"
            [attr.aria-label]="'Hide password'" [attr.aria-pressed]="showPassword()">
            <mat-icon>{{showPassword() ? 'visibility' : 'visibility_off'}}</mat-icon>
          </button>
        </mat-form-field>

        <!-- Remember & Forgot -->
        <div class="flex items-center justify-between pb-2 -mt-4">
          <mat-checkbox color="primary" class="text-sm">
            Remember me
          </mat-checkbox>
          <a href="#" class="text-xs text-purple-400 hover:text-purple-300 transition-colors duration-200">
            Forgot password?
          </a>
        </div>

        <!-- Submit Button -->
        <button mat-flat-button color="primary" type="submit" [disabled]="isLoading()"
          class="w-full py-6 font-semibold tracking-wide text-white"
          style="background: linear-gradient(135deg, #7c3aed, #6d28d9, #4f46e5); border-radius: 12px;">
          @if (isLoading()) {
          <div class="flex items-center justify-center gap-2">
            <svg class="animate-spin h-5 w-5 text-white" viewBox="0 0 24 24" fill="none">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
            </svg>
            Signing in...
          </div>
          } @else {
          Sign In
          }
        </button>
      </form>

      <!-- Divider -->
      <div class="flex items-center gap-4 my-5">
        <div class="flex-1 h-px bg-white/10"></div>
        <span class="text-xs text-white/30 font-medium">OR</span>
        <div class="flex-1 h-px bg-white/10"></div>
      </div>

      <!-- Social Login Buttons -->
      <div class="grid grid-cols-2 gap-3">
        <button type="button"
          class="flex items-center justify-center gap-2 py-3 rounded-xl border border-white/10 text-white/60 hover:text-white hover:border-white/20 transition-all duration-300 text-sm cursor-pointer"
          style="background: rgba(255,255,255,0.04);">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" />
            <path
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
            <path
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
            <path
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
          </svg>
          Google
        </button>
        <button type="button"
          class="flex items-center justify-center gap-2 py-3 rounded-xl border border-white/10 text-white/60 hover:text-white hover:border-white/20 transition-all duration-300 text-sm cursor-pointer"
          style="background: rgba(255,255,255,0.04);">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
            <path
              d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0112 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z" />
          </svg>
          GitHub
        </button>
      </div>

      <!-- Sign Up Link -->
      <p class="text-center text-sm text-white/40 mt-7">
        Don't have an account?
        <a routerLink="/auth/register"
          class="text-purple-400 hover:text-purple-300 font-semibold transition-colors duration-200 ml-1">
          Create Account
        </a>
      </p>
    </div>
  </div>

  <!-- Bottom glow accent -->
  <div class="absolute -bottom-px left-12 right-12 h-px"
    style="background: linear-gradient(90deg, transparent, rgba(6,182,212,0.3), transparent);"></div>
</div>
